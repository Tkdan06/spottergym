# Spotter production nginx (open public)
# 1) Build frontend: npm ci && VITE_API_URL= VITE_SITE_LOCK_ENABLED=false npm run build
# 2) Copy dist → /var/www/spottergym/dist
# 3) Certbot for TLS after DNS points here
# 4) API via Docker on 127.0.0.1:3001

limit_req_zone $binary_remote_addr zone=spotter_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=spotter_api:10m rate=120r/m;

upstream spotter_api {
  server 127.0.0.1:3001;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name spottergym.ru www.spottergym.ru;

  # After certbot, this block usually becomes redirect-only to HTTPS.
  # return 301 https://$host$request_uri;

  root /var/www/spottergym/dist;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 2m;

  location /api/ {
    limit_req zone=spotter_api burst=60 nodelay;
    proxy_pass http://spotter_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /api/auth/login {
    limit_req zone=spotter_auth burst=10 nodelay;
    proxy_pass http://spotter_api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/register {
    limit_req zone=spotter_auth burst=10 nodelay;
    proxy_pass http://spotter_api/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
