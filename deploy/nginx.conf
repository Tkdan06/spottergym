# Spotter production nginx (open public)
# 1) Build frontend: npm ci && VITE_API_URL= VITE_SITE_LOCK_ENABLED=false npm run build
# 2) Copy dist → /var/www/spottergym/dist
# 3) Certbot for TLS after DNS points here (certbot clones these locations into :443)
# 4) API via Docker on 127.0.0.1:3001
#
# CRITICAL: /api/ must use ^~ so location ~* \.(jpg|png|…)$ does NOT steal
# /api/media/*.jpg from the API. Also exclude /api/ from the static regex.
# If photos show gender stubs after certbot, run: sudo ./deploy/fix-nginx-media.sh

limit_req_zone $binary_remote_addr zone=spotter_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=spotter_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=spotter_analytics:10m rate=60r/m;

upstream spotter_api {
  server 127.0.0.1:3001;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name spottergym.ru www.spottergym.ru;

  # After certbot, this block usually becomes redirect-only to HTTPS.
  # return 301 https://$host$request_uri;

  root /var/www/spottergym/dist;
  index index.html;
  # Public routes get unique HTML from scripts/prerender-seo.mjs
  # (dist/lp/index.html, dist/guide/.../index.html). try_files $uri $uri/ serves them.

  # Let's Encrypt HTTP-01 (must be before SPA try_files)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/spottergym/dist;
    default_type "text/plain";
    allow all;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;

  client_max_body_size 8m;

  # ^~ so regex static (*.jpg/png…) does NOT steal /api/media/*.jpg from the API
  location ^~ /api/ {
    limit_req zone=spotter_api burst=60 nodelay;
    proxy_pass http://spotter_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /api/auth/login {
    limit_req zone=spotter_auth burst=10 nodelay;
    proxy_pass http://spotter_api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/register {
    limit_req zone=spotter_auth burst=10 nodelay;
    proxy_pass http://spotter_api/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/forgot-password {
    limit_req zone=spotter_auth burst=8 nodelay;
    proxy_pass http://spotter_api/auth/forgot-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/reset-password {
    limit_req zone=spotter_auth burst=8 nodelay;
    proxy_pass http://spotter_api/auth/reset-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/analytics/lp {
    limit_req zone=spotter_analytics burst=30 nodelay;
    proxy_pass http://spotter_api/analytics/lp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # OG share art must not stick for a week — messengers re-scrape these often
  location ~* ^/og-(share|image)\.png$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # Never match /api/* (belt-and-suspenders if ^~ on /api/ is dropped)
  location ~* ^/(?!api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
