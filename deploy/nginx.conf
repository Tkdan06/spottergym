# Пример для VPS / хостинга с Nginx: spottergym.ru
# Скопируй в sites-available и укажи root на папку dist после npm run build.

server {
  listen 80;
  listen [::]:80;
  server_name spottergym.ru www.spottergym.ru;

  root /var/www/spottergym/dist;
  index index.html;

  # SPA: все пути → index.html (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
