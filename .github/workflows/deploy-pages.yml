# Статический хостинг на GitHub Pages (бесплатно).
# После первого пуша: Settings → Pages → Source = GitHub Actions.
# Домен: Settings → Pages → Custom domain = spottergym.ru
# DNS у регистратора: CNAME → <user>.github.io

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Закрытый доступ: включи/выключи через Repo Variables / Secrets
      # Variables: SITE_LOCK_ENABLED=true|false, SITE_LOCK_USER=...
      # Secrets: SITE_LOCK_PASSWORD=...
      - name: Build
        env:
          VITE_SITE_LOCK_ENABLED: ${{ vars.SITE_LOCK_ENABLED }}
          VITE_SITE_LOCK_USER: ${{ vars.SITE_LOCK_USER }}
          VITE_SITE_LOCK_PASSWORD: ${{ secrets.SITE_LOCK_PASSWORD }}
        run: npm run build
      # SPA fallback для GitHub Pages (прямые URL /app/... )
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
