<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101612"/>
      <stop offset="55%" stop-color="#0B0F0E"/>
      <stop offset="100%" stop-color="#070A09"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="45%">
      <stop offset="0%" stop-color="#C8F542" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C8F542" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="780" y="520" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="620" font-weight="900" fill="#121816">S</text>

  <!-- Two separate runs so colors cannot merge: SPOT white, TER lime -->
  <text x="392" y="300" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="118" font-weight="900" letter-spacing="-4" fill="#FFFFFF">SPOT</text>
  <text x="678" y="300" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="118" font-weight="900" letter-spacing="-4" fill="#C8F542">TER</text>

  <line x1="310" y1="340" x2="890" y2="340" stroke="#C8F542" stroke-width="4" stroke-linecap="round"/>
  <circle cx="310" cy="340" r="5" fill="#C8F542"/>
  <circle cx="890" cy="340" r="5" fill="#C8F542"/>
  <text x="600" y="400" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#F2F5F3">Найди людей в своём клубе</text>
</svg>
